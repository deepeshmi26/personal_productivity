openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: responses
    description: Learning responses
  - name: settings
    description: User settings
  - name: cards
    description: Memory quiz cards
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /responses:
    get:
      operationId: listResponses
      tags: [responses]
      summary: List all learning responses
      description: Returns all responses, newest first
      responses:
        "200":
          description: List of responses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningResponse"
    post:
      operationId: createResponse
      tags: [responses]
      summary: Create a new learning response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResponseRequest"
      responses:
        "201":
          description: Created response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningResponse"
  /responses/stats:
    get:
      operationId: getResponseStats
      tags: [responses]
      summary: Get response statistics
      description: Returns a daily breakdown of how many responses were captured
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseStats"
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get user settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update user settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
  /cards/session:
    get:
      operationId: getCardSession
      tags: [cards]
      summary: Get cards for a quiz session
      description: Returns up to 10 non-skipped responses from the last 30 days, ordered forgot-first then never-reviewed then random
      responses:
        "200":
          description: Session cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningResponse"
  /cards/{responseId}/review:
    post:
      operationId: reviewCard
      tags: [cards]
      summary: Record a card review result
      parameters:
        - name: responseId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardReviewRequest"
      responses:
        "204":
          description: Review recorded
        "404":
          description: Response not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LearningResponse:
      type: object
      properties:
        id:
          type: integer
        text:
          type: string
          description: The user's response text, or empty string if "I don't know"
        skipped:
          type: boolean
          description: True if the user tapped "I don't know"
        createdAt:
          type: string
          format: date-time
        question:
          type: string
          description: AI-generated quiz question for this entry, or empty string if not yet generated
      required:
        - id
        - text
        - skipped
        - createdAt
    CreateResponseRequest:
      type: object
      properties:
        text:
          type: string
        skipped:
          type: boolean
      required:
        - text
        - skipped
    ResponseStats:
      type: object
      properties:
        total:
          type: integer
        answered:
          type: integer
        skipped:
          type: integer
        days:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                description: ISO date (YYYY-MM-DD)
              count:
                type: integer
            required:
              - date
              - count
      required:
        - total
        - answered
        - skipped
        - days
    Settings:
      type: object
      properties:
        reminderIntervalMinutes:
          type: integer
          minimum: 1
          maximum: 240
        quietHoursEnabled:
          type: boolean
        quietHoursStart:
          type: string
          description: "Start of quiet window in HH:mm (24h)"
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        quietHoursEnd:
          type: string
          description: "End of quiet window in HH:mm (24h)"
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
      required:
        - reminderIntervalMinutes
        - quietHoursEnabled
        - quietHoursStart
        - quietHoursEnd
    CardReviewRequest:
      type: object
      properties:
        result:
          type: string
          enum: [remembered, forgot]
      required:
        - result
    UpdateSettingsRequest:
      type: object
      properties:
        reminderIntervalMinutes:
          type: integer
          minimum: 1
          maximum: 240
        quietHoursEnabled:
          type: boolean
        quietHoursStart:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        quietHoursEnd:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
